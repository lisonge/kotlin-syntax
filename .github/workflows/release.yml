name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
      - name: Validate release tag
        run: node scripts/release-version.ts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check generated lexer
        run: pnpm generate
      - name: Verify generated lexer is unchanged
        run: git diff --exit-code -- kotlin-parser/src/commonMain/kotlin/li/songe/kotlin/lexer
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test:built
      - name: Package VSIX
        working-directory: kotlin-vscode
        env:
          KOTLIN_VSCODE_SKIP_BUILD: '1'
        run: pnpm dlx @vscode/vsce@4.0.0 package --no-dependencies --out kotlin-syntax.vsix
      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: kotlin-vscode/kotlin-syntax.vsix
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-ubuntu-latest
          path: kotlin-parser/build/reports/tests/
          if-no-files-found: warn

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/kotlin-syntax.vsix
          body_path: kotlin-vscode/CHANGELOG.md

  publish-marketplace:
    name: Publish VS Code Marketplace
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: release
      - name: Publish existing VSIX
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm dlx @vscode/vsce@4.0.0 publish --packagePath release/kotlin-syntax.vsix

  publish-openvsx:
    name: Publish Open VSX
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: release
      - name: Publish existing VSIX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: pnpm dlx ovsx@1.3.0 publish release/kotlin-syntax.vsix
