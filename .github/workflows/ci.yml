name: CI
on:
  pull_request:
  push:
    branches:
      - '**'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check generated lexer
        run: pnpm generate:check
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test:built
      - name: deploy pages
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        working-directory: kotlin-website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm dlx --allow-build=sharp --allow-build=workerd wrangler@4
          pages deploy dist --project-name=kotlin-syntax
      - name: Package VSIX
        working-directory: kotlin-vscode
        env:
          KOTLIN_VSCODE_SKIP_BUILD: '1'
        run: pnpm dlx @vscode/vsce@4.0.0 package --no-dependencies --changelog-path dist/CHANGELOG.md --out kotlin-syntax.vsix
      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: kotlin-vscode/kotlin-syntax.vsix
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-ubuntu-latest
          path: |
            kotlin-parser/build/reports/tests/
            kotlin-format/build/reports/tests/
            kotlin-format/build/oracle/failures.txt
          if-no-files-found: warn
